# Admin panel configuration (Decap CMS).
# Every field here maps to content/site.json, which the homepage renders.
# Saving in /admin commits to the main branch; the host then redeploys automatically.

backend:
  name: github
  repo: Jasser1920/CV-perso
  branch: main
  commit_messages:
    update: Update website content from admin
local_backend: true
publish_mode: simple
media_folder: img/uploads
public_folder: img/uploads
site_url: https://jasser-nahali.netlify.app
display_url: https://jasser-nahali.netlify.app
collections:
- name: website
  label: Website
  editor:
    preview: true
  files:
  - name: site
    label: Edit the whole website
    file: content/site.json
    format: json
    fields:
    - name: meta
      label: SEO (browser tab & Google)
      widget: object
      collapsed: true
      fields:
      - name: title
        label: Page title
        widget: string
      - name: description
        label: Search description
        widget: text
    - name: profile
      label: Profile & contact details
      widget: object
      collapsed: true
      fields:
      - name: first_name
        label: First name
        widget: string
      - name: last_name
        label: Last name
        widget: string
      - name: photo
        label: Portrait photo
        widget: image
        hint: Use a portrait (vertical) photo, at least 1200px wide, JPG under 500 KB.
      - name: email
        label: Email
        widget: string
      - name: phone
        label: Phone
        widget: string
      - name: location
        label: Location
        widget: object
        collapsed: false
        summary: '{{fields.en}}'
        fields:
        - name: en
          label: English
          widget: string
        - name: fr
          label: Français
          widget: string
      - name: cv_en
        label: CV (English PDF)
        widget: file
      - name: cv_fr
        label: CV (French PDF)
        widget: file
