<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Jasser Nahali — Software Engineer</title>
	<meta name="description" content="Jasser Nahali, software engineer specialized in full-stack architecture, microservices and real-time backend systems. Based in Tunis.">
	<link rel="icon" href="img/favicon.png" type="image/png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
	<link rel="stylesheet" href="css/main.css">
</head>

<!-- All text, links and images on this page come from content/site.json.
     Edit them from /admin instead of changing this file. -->
<body class="is-loading">

	<header class="site-header" id="top">
		<div class="wrap">
			<button class="menu-toggle label" type="button" aria-expanded="false" aria-controls="site-nav" data-t="nav.menu"></button>

			<nav class="nav label" id="site-nav" aria-label="Main">
				<a href="#about" data-t="nav.about" data-section="about"></a>
				<a href="#experience" data-t="nav.experience" data-section="experience"></a>
				<a href="#languages" data-t="nav.languages" data-section="languages"></a>
				<a href="#contact" data-t="nav.contact" data-section="contact"></a>
			</nav>

			<a class="wordmark" href="#top" data-full-name></a>

			<div class="tools label">
				<div class="lang" role="group" aria-label="Language">
					<button type="button" class="lang-btn" data-lang="en">EN</button>
					<span aria-hidden="true">/</span>
					<button type="button" class="lang-btn" data-lang="fr">FR</button>
				</div>
				<div class="cv">
					<button type="button" class="cv-toggle link-line" aria-expanded="false" aria-haspopup="true">
						CV<span class="cv-label"> &middot; <span data-t="nav.download"></span></span>
					</button>
					<div class="cv-menu" role="menu">
						<a role="menuitem" id="cv-en" download target="_blank" rel="noopener">English edition</a>
						<a role="menuitem" id="cv-fr" download target="_blank" rel="noopener">Édition française</a>
					</div>
				</div>
			</div>
		</div>
	</header>

	<main>

		<section class="hero" id="hero">
			<div class="hero-media">
				<img id="hero-photo" alt="" width="1600" height="1967" fetchpriority="high">
				<p class="hero-caption label" data-t="profile.location"></p>
			</div>
			<div class="hero-text">
				<p class="label" data-t="hero.eyebrow"></p>
				<h1><span data-t="profile.first_name"></span><span data-t="profile.last_name"></span></h1>
				<p class="label hero-title" data-t="hero.title"></p>
				<p class="hero-desc" data-t="hero.description"></p>
				<div class="hero-links label">
					<a class="link-line" href="#experience" data-t="hero.cta_work"></a>
					<a class="link-line" href="#contact" data-t="hero.cta_contact"></a>
				</div>
			</div>
		</section>

		<section class="section" id="about">
			<div class="wrap">
				<div class="section-head">
					<p class="label" data-t="about.eyebrow"></p>
					<h2 data-t="about.title"></h2>
				</div>
				<p class="about-body" data-t="about.body"></p>
				<div class="pillars" id="pillars"></div>
			</div>
		</section>

		<section class="section band" id="experience">
			<div class="wrap">
				<div class="section-head">
					<p class="label" data-t="experience.eyebrow"></p>
					<h2 data-t="experience.title"></h2>
				</div>
				<div class="tabs label" role="tablist">
					<button class="tab" role="tab" id="tab-exp" aria-controls="panel-exp" aria-selected="true" data-t="experience.tab_jobs"></button>
					<button class="tab" role="tab" id="tab-edu" aria-controls="panel-edu" aria-selected="false" data-t="experience.tab_education"></button>
				</div>
				<div class="entries" id="panel-exp" role="tabpanel" aria-labelledby="tab-exp"></div>
				<div class="entries" id="panel-edu" role="tabpanel" aria-labelledby="tab-edu" hidden></div>
			</div>
		</section>

		<section class="section" id="stack">
			<div class="wrap">
				<div class="section-head">
					<p class="label" data-t="stack.eyebrow"></p>
					<h2 data-t="stack.title"></h2>
				</div>
				<ul class="stack" id="stack-list"></ul>
			</div>
		</section>

		<section class="section band" id="languages">
			<div class="wrap">
				<div class="section-head">
					<p class="label" data-t="languages.eyebrow"></p>
					<h2 data-t="languages.title"></h2>
				</div>
				<div class="languages" id="language-list"></div>
			</div>
		</section>

		<section class="section contact" id="contact">
			<div class="wrap">
				<div class="section-head">
					<p class="label" data-t="contact.eyebrow"></p>
					<h2 data-t="contact.title"></h2>
				</div>
				<a class="contact-mail link-line" id="contact-mail"></a>
				<div class="contact-meta label">
					<a id="contact-phone"></a>
					<span data-t="profile.location"></span>
				</div>
				<div class="socials label" id="socials"></div>
			</div>
		</section>

	</main>

	<footer class="site-footer">
		<div class="wrap label">
			<span>&copy; <span id="year"></span> <span data-full-name></span></span>
			<a class="link-line" href="#top" data-t="footer.back_to_top"></a>
		</div>
	</footer>

	<script src="js/render.js"></script>
	<script src="js/main.js"></script>
</body>

</html>
